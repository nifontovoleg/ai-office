name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, tests and dependency audits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Type-check and build UI
        run: npm run build
        working-directory: frontend
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime and audit dependencies
        run: python -m pip install -r requirements.txt pip-audit
      - name: Backend unit, integration and security contracts
        run: python -m unittest discover -s tests -v
      - name: Check documentation and publication boundary
        run: python tools/check_repository.py
      - name: Check empty-key provider presets offline
        run: |
          python tools/opencode.py --check --env-file .env.example
          python tools/opencode.py --check --env-file config/openai.env.example
          python tools/opencode.py --check --env-file config/proxyapi.env.example
          python tools/opencode.py --check --env-file config/claude.env.example
          python tools/codex.py --check --env-file .env.example
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
      - name: Audit frontend dependencies
        run: npm audit
        working-directory: frontend
      - name: Validate Compose configuration
        run: docker compose config --quiet
